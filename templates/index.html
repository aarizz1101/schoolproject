<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Modern Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>TaskMaster</span>
            </div>
            <nav>
                <a href="#" class="nav-item active" id="nav-today">
                    <i class="fa-solid fa-calendar-day"></i> Today
                </a>
                <a href="#" class="nav-item" id="nav-calendar">
                    <i class="fa-solid fa-calendar-days"></i> Calendar
                </a>
                <a href="#" class="nav-item" id="nav-upcoming">
                    <i class="fa-solid fa-list-check"></i> Upcoming Tasks
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header>
                <h1 id="page-title">Today's Tasks</h1>
                <div class="date-display" id="current-date-display"></div>
            </header>

            <!-- Views Container -->
            <div class="views-wrapper">
                
                <!-- Task List View -->
                <section id="task-view" class="view-section active">
                    <div class="add-task-container">
                        <form id="add-task-form">
                            <input type="text" id="task-input" placeholder="What needs to be done today?" required>
                            <input type="date" id="task-date" required>
                            <button type="submit" class="btn-primary">
                                <i class="fa-solid fa-plus"></i> Add
                            </button>
                        </form>
                    </div>

                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="incomplete">Incomplete</button>
                        <button class="filter-btn" data-filter="partially complete">Partial</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>

                    <div class="task-list" id="task-list">
                        <!-- Tasks will be populated here -->
                        <div class="empty-state">Loading tasks...</div>
                    </div>
                </section>

                <!-- Calendar View -->
                <section id="calendar-view" class="view-section">
                    <div class="calendar-header">
                        <button id="prev-month" class="btn-icon"><i class="fa-solid fa-chevron-left"></i></button>
                        <h2 id="month-display">September 2026</h2>
                        <button id="next-month" class="btn-icon"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    
                    <div class="calendar-grid">
                        <div class="weekday">Sun</div>
                        <div class="weekday">Mon</div>
                        <div class="weekday">Tue</div>
                        <div class="weekday">Wed</div>
                        <div class="weekday">Thu</div>
                        <div class="weekday">Fri</div>
                        <div class="weekday">Sat</div>
                        <!-- Days will be generated by JS -->
                    </div>
                </section>
                
                <!-- Upcoming Tasks View -->
                <section id="upcoming-view" class="view-section">
                    <div class="task-list" id="upcoming-task-list">
                        <!-- Upcoming tasks will be populated here -->
                    </div>
                </section>
                
            </div>
        </main>
    </div>

    <!-- Task Item Template -->
    <template id="task-template">
        <div class="task-item">
            <div class="task-status-selector">
                <select class="status-select">
                    <option value="incomplete">Incomplete</option>
                    <option value="partially complete">Partial</option>
                    <option value="completed">Completed</option>
                </select>
                <div class="status-indicator"></div>
            </div>
            <div class="task-content">
                <h3 class="task-title"></h3>
                <span class="task-date-badge"></span>
            </div>
            <div class="task-actions">
                <button class="btn-icon delete-btn"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    </template>

    <!-- Add Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Add Task</h2>
            <form id="modal-task-form">
                <input type="text" id="modal-task-input" placeholder="What needs to be done?" required>
                <input type="date" id="modal-task-date" required>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Add
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
